spacing_mode: resample_to_common_spacing

target_spacing_mm:
  x: auto
  y: auto
  z: 2.0

spacing_tolerance_mm: 0.01
crop_margin_mm: [6.0, 6.0, 6.0]

roi:
  mode: preferred_label_with_fallback
  preferred_label: 2
  preferred_name: tumor
  min_preferred_volume_mm3: 100.0
  component_policy: largest
  connectivity: 26
  fallback_mode: all_foreground
  fallback_name: pancreas_fallback

hu_min: -150.0
hu_max: 250.0

canvas_policy: dataset_max
canvas_percentile: 99.0
overflow_policy: error
patch_size: 16
padding_value_rescaled: 0.0

alignment:
  affine_atol: 1.0e-4
  spacing_atol: 1.0e-4
  resample_mask_to_ct: false
