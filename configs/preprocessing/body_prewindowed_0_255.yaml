spacing_mode: resample_to_common_spacing

target_spacing_mm:
  x: auto
  y: auto
  z: 2.0

spacing_tolerance_mm: 0.01

# The body bbox is exact: air sits at exactly 0 in these prewindowed volumes,
# so no margin is needed to avoid shaving skin. A margin would only re-add the
# background this ROI exists to remove.
crop_margin_mm: [0.0, 0.0, 0.0]

# Whole CT minus the air around the patient. Unlike the pancreas/tumor ROIs
# this uses no segmentation, so no mask is required.
roi:
  mode: body
  source_name: body
  threshold: 0.0
  # Ten PMPD_v2 cases end in a uniform filler slice (value 0 or 50) carrying no
  # anatomy. Trimmed from the axial ends here; an interior one raises.
  drop_degenerate_slices: true

# PMPD_v2 images have already been windowed by the source pipeline.
# Reference: WW=250, WL=75 -> HU [-49.5, 200.5], scaled to [0, 255].
intensity:
  mode: prewindowed_0_255
  input_min: 0.0
  input_max: 255.0
  range_tolerance: 1.0e-3
  # See full_volume_prewindowed_0_255.yaml: PANGENE_OG:PANCREAS_516 carries the
  # cohort transfer function without the final clamp.
  out_of_range_policy: clip
  max_out_of_range_fraction: 0.05
  max_out_of_range_magnitude: 64.0
  source_window_width: 250.0
  source_window_level: 75.0
  source_hu_min: -49.5
  source_hu_max: 200.5

# Retained for backwards-compatible function arguments; no HU window is reapplied.
hu_min: -49.5
hu_max: 200.5

canvas_policy: dataset_max
canvas_percentile: 99.0
overflow_policy: error
patch_size: 16
padding_value_rescaled: 0.0

alignment:
  affine_atol: 1.0e-4
  spacing_atol: 1.0e-4
  resample_mask_to_ct: false
