# @package _global_
model:
  _target_: model_arch.pancreas_lightning.PancreasMetastasisLightningModule

  backbone_name: facebook/dinov3-vitb16-pretrain-lvd1689m
  lora_rank: 8
  lora_alpha: 16
  # Benchmarked on the 640x640 full-volume canvas (RTX 5000 Ada, 32 GB): chunk 8
  # is 1.6x faster than chunk 1 at the same 4.7 GiB peak. The body canvas is
  # smaller, so those headroom figures remain conservative here. Checkpointing
  # stays on: without it the worst-case slice count runs out of memory, since
  # every slice activation is retained for the pooling.
  slice_chunk_size: 8
  gradient_checkpointing: true

  loss: focal
  focal_gamma: 2.0
  focal_alpha: 0.25
  pos_weight: null

  lora_lr: 1.0e-4
  lora_weight_decay: 1.0e-5
  head_lr: 1.0e-3
  head_weight_decay: 1.0e-4

  threshold: 0.5
  threshold_mode: fixed
  fold: ${data.fold}
  output_dir: outputs/pmpd_v2_vitb_pancreas_base_body_cv

  max_epochs: 100
  precision: bf16-mixed
  seed: 0
  early_stopping_patience: 20
  early_stopping_metric: val_pr_auc
  early_stopping_min_delta: 0.0
  checkpoint_metric: val_pr_auc
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4
  devices: 1
  accelerator: auto
  strategy: auto
  log_every_n_steps: 10
  enable_progress_bar: false
  save_top_k: 1

  run_name: anymc3d-dinov3-vitb-pmpd-v2-pancreas-base-body
